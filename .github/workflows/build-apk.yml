name: Build Qashqai Launcher APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Permite correrlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK (debug — no necesita firma)
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: qashqai-launcher-v17
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
