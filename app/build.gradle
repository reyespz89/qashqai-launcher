apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    namespace 'com.emiliano.qashqailauncher'

    defaultConfig {
        applicationId "com.emiliano.qashqailauncher"
        minSdkVersion 26          // Android 8+ — tu radio tiene Android 15
        targetSdkVersion 34
        versionCode 17            // v17 del mockup
        versionName "1.7"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Assets: el HTML del launcher
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    // Sin dependencias externas — WebView es parte de Android SDK
}
