<title>Qashqai Launcher BMW</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:#000;
  font-family:'DM Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;
}

/* ── RAÍZ 16:9 SIEMPRE LANDSCAPE ── */
.root{
  width:  min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9  / 16));
  position:relative;overflow:hidden;
  display:grid;
  grid-template-rows: 20px 1fr 48px;
  font-size: calc(min(100vw, calc(100vh * 16 / 9)) / 82);
  color:#e8ecf2;
}

/* ── FONDO ANIMADO — respiración BMW ── */
.root-bg{
  position:absolute;inset:0;z-index:0;
  background:#070a0f;
  overflow:hidden;
}
.root-bg::before{
  content:'';position:absolute;
  width:120%;height:120%;
  top:-10%;left:-10%;
  background:
    radial-gradient(ellipse 55% 45% at 20% 30%, rgba(30,70,180,.07) 0%, transparent 65%),
    radial-gradient(ellipse 40% 50% at 80% 70%, rgba(20,50,160,.06) 0%, transparent 60%),
    radial-gradient(ellipse 35% 35% at 55% 20%, rgba(60,100,220,.04) 0%, transparent 55%);
  animation:bgbreathe 8s ease-in-out infinite alternate;
}
.root-bg::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 100%, rgba(10,25,80,.35) 0%, transparent 70%);
}
@keyframes bgbreathe{
  0%  {transform:scale(1)   rotate(0deg);  opacity:.7}
  50% {transform:scale(1.04)rotate(.8deg); opacity:1}
  100%{transform:scale(1.02)rotate(-.4deg);opacity:.85}
}

/* Todas las capas sobre el fondo */
.root>*:not(.root-bg){position:relative;z-index:1}

/* ── STATUS BAR ── */
.sb{
  background:rgba(5,7,16,.85);
  border-bottom:1px solid rgba(120,160,255,.08);
  display:flex;align-items:center;
  padding:0 1.2em;gap:.9em;
  font-size:.72em;font-weight:300;
  color:rgba(200,215,255,.35);letter-spacing:.08em;
  position:relative;z-index:10;
}
.sb-r{margin-left:auto;display:flex;align-items:center;gap:.7em}
.sbi{width:.85em;height:.85em;fill:rgba(200,215,255,.32);flex-shrink:0}
.sb-sep{width:1px;height:.9em;background:rgba(120,160,255,.12)}
.sb-signal{display:flex;align-items:flex-end;gap:1.5px}
.sb-signal span{width:2px;border-radius:1px;background:rgba(200,215,255,.35)}
.sb-bmw{
  display:flex;align-items:center;gap:.4em;
  color:rgba(100,160,255,.70);font-size:.9em;
}
.sb-bmw-dot{
  width:.5em;height:.5em;border-radius:50%;
  background:#4a9fff;
  box-shadow:0 0 .4em .1em rgba(74,159,255,.55);
}
/* Velocidad GPS en status bar */
.sb-speed{
  display:flex;align-items:baseline;gap:.2em;
  color:rgba(200,220,255,.55);
}
.sb-speed-val{font-size:1.1em;font-weight:300;font-variant-numeric:tabular-nums}
.sb-speed-unit{font-size:.78em;font-weight:200;color:rgba(160,195,255,.30);letter-spacing:.06em}
/* Límite de velocidad */
.sb-limit{
  display:flex;align-items:center;justify-content:center;
  width:1.55em;height:1.55em;
  border-radius:50%;
  border:1.5px solid rgba(255,200,80,.55);
  background:rgba(255,200,80,.08);
  font-size:.78em;font-weight:400;
  color:rgba(255,220,100,.70);
  letter-spacing:0;
}

/* ── ZONA PRINCIPAL 3 COLUMNAS ── */
.main{
  display:grid;
  grid-template-columns: 260px 1fr 240px;
  overflow:hidden;
  position:relative;z-index:1;
}
.main::after{
  content:'';position:absolute;
  top:0;bottom:0;left:260px;
  width:1px;
  background:linear-gradient(180deg,transparent 0%,rgba(74,159,255,.18) 30%,rgba(74,159,255,.22) 50%,rgba(74,159,255,.18) 70%,transparent 100%);
  pointer-events:none;z-index:2;
}
.main::before{
  content:'';position:absolute;
  top:0;bottom:0;right:240px;
  width:1px;
  background:linear-gradient(180deg,transparent 0%,rgba(74,159,255,.18) 30%,rgba(74,159,255,.22) 50%,rgba(74,159,255,.18) 70%,transparent 100%);
  pointer-events:none;z-index:2;
}

/* ── PANEL IZQUIERDO ── */
.p-left{
  display:flex;flex-direction:column;
  background:rgba(6,9,14,.80);
  overflow:hidden;
}

/* PUNTO 1 — Reloj + Clima unificado BMW */
.clock-weather{
  padding:.65em 1.1em .6em;
  flex-shrink:0;
  border-bottom:1px solid rgba(74,159,255,.07);
  display:flex;flex-direction:column;
  gap:.45em;
}
.clk-time{
  font-size:3.5em;font-weight:100;
  color:#ddeaff;
  letter-spacing:-.05em;line-height:1;
  font-variant-numeric:tabular-nums;
}
.clk-date{
  font-size:.57em;font-weight:200;
  color:rgba(160,190,255,.28);
  letter-spacing:.09em;
  text-transform:uppercase;
}
/* Clima — dentro del mismo bloque */
.weather-inline{
  display:flex;align-items:center;gap:.7em;
  padding:.35em .5em;
  background:rgba(74,159,255,.05);
  border:1px solid rgba(74,159,255,.08);
  border-radius:.5em;
  margin-top:.1em;
}
.w-icon{font-size:1.4em;line-height:1;filter:brightness(.85)}
.w-temps{display:flex;flex-direction:column;gap:.05em}
.w-temp{font-size:1.1em;font-weight:100;color:#c8dcff;line-height:1}
.w-cond{font-size:.52em;font-weight:200;color:rgba(140,175,255,.28);letter-spacing:.04em}
/* Temperatura interior del auto */
.w-interior{
  margin-left:auto;
  display:flex;flex-direction:column;align-items:flex-end;gap:.05em;
}
.w-int-val{font-size:.9em;font-weight:200;color:rgba(160,200,255,.45)}
.w-int-lbl{font-size:.48em;font-weight:200;color:rgba(100,145,220,.25);letter-spacing:.06em;text-transform:uppercase}

/* Grid apps */
.apps-left{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
  gap:.5px;
  background:rgba(74,159,255,.04);
}
.app{
  background:rgba(7,9,14,.80);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:.45em;cursor:pointer;
  border:none;font-family:inherit;color:inherit;
  position:relative;overflow:hidden;
  transition:background .12s;
}
.app::before{
  content:'';position:absolute;inset:0;
  background:rgba(74,159,255,.0);
  transition:background .12s;
}
.app:hover::before,.app:active::before{background:rgba(74,159,255,.08)}
.app-icon{
  width:1.9em;height:1.9em;border-radius:.65em;
  display:flex;align-items:center;justify-content:center;
  background:rgba(74,159,255,.09);
  border:1px solid rgba(74,159,255,.14);
  position:relative;z-index:1;
}
.app-icon svg{width:1.05em;height:1.05em;fill:rgba(140,185,255,.60)}
.app span{font-size:.52em;font-weight:300;color:rgba(160,195,255,.28);letter-spacing:.05em;position:relative;z-index:1}
.app.app-nav .app-icon{background:rgba(74,159,255,.13);border-color:rgba(74,159,255,.22)}
.app.app-nav .app-icon svg{fill:#5ba3ff}
.app.app-tel .app-icon{background:rgba(52,211,153,.10);border-color:rgba(52,211,153,.18)}
.app.app-tel .app-icon svg{fill:#34d399}
.app.app-music .app-icon{background:rgba(251,146,60,.10);border-color:rgba(251,146,60,.18)}
.app.app-music .app-icon svg{fill:#fb923c}

/* ── PANEL CENTRAL ── */
.p-center{
  display:flex;flex-direction:column;
  background:rgba(5,8,13,.75);
  overflow:hidden;
}
.c-tabs{
  display:flex;align-items:stretch;
  height:2.8em;
  background:rgba(4,6,11,.85);
  border-bottom:1px solid rgba(74,159,255,.08);
  flex-shrink:0;
}
.c-tab{
  flex:1;display:flex;align-items:center;justify-content:center;gap:.5em;
  background:none;border:none;cursor:pointer;font-family:inherit;
  font-size:.58em;font-weight:300;
  color:rgba(140,175,255,.28);
  letter-spacing:.10em;text-transform:uppercase;
  transition:color .15s;
  border-bottom:1.5px solid transparent;margin-bottom:-1px;
  position:relative;
}
.c-tab svg{width:1em;height:1em;fill:currentColor;opacity:.7}
.c-tab:hover{color:rgba(140,175,255,.55)}
.c-tab.active{color:#5ba3ff;border-bottom-color:#4a9fff}
.c-tab.active svg{opacity:1}
.tab-dot{width:.38em;height:.38em;border-radius:50%;background:#22c55e;box-shadow:0 0 .35em #22c55e;flex-shrink:0}
.c-pane{display:none;flex:1;flex-direction:column;overflow:hidden}
.c-pane.active{display:flex}

/* Android Auto pane */
.aa-zone{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1em;
  background:none;border:none;cursor:pointer;
  font-family:inherit;color:inherit;
  position:relative;overflow:hidden;
  transition:opacity .12s;padding:1em;
}
.aa-zone:active{opacity:.75}
.bmw-orb{
  width:4em;height:4em;border-radius:50%;
  position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.bmw-orb::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:1px solid rgba(74,159,255,.20);
  animation:orbring 3s ease-in-out infinite;
}
.bmw-orb::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 35%,rgba(140,195,255,.30) 0%,rgba(74,159,255,.60) 40%,rgba(30,80,200,.75) 80%,rgba(15,40,130,.90) 100%);
  box-shadow:0 0 1.5em rgba(74,159,255,.50),inset 0 .15em .5em rgba(200,230,255,.15);
  animation:orbpulse 2.5s ease-in-out infinite;
}
.bmw-orb-icon{position:relative;z-index:1;width:1.7em;height:1.7em;fill:#c8e4ff}
@keyframes orbring{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.06);opacity:.8}}
@keyframes orbpulse{
  0%,100%{box-shadow:0 0 1.5em rgba(74,159,255,.50),inset 0 .15em .5em rgba(200,230,255,.15)}
  50%{box-shadow:0 0 2.2em rgba(74,159,255,.70),inset 0 .15em .6em rgba(200,230,255,.22)}
}
.aa-title{font-size:.95em;font-weight:200;color:rgba(200,220,255,.75);letter-spacing:.04em}
.aa-sub{font-size:.55em;font-weight:200;color:rgba(100,150,255,.38);letter-spacing:.08em;text-transform:uppercase}
.aa-chip{
  display:flex;align-items:center;gap:.45em;
  background:rgba(74,159,255,.07);border:1px solid rgba(74,159,255,.15);
  border-radius:100px;padding:.3em 1em;
  font-size:.52em;font-weight:200;color:rgba(140,185,255,.50);letter-spacing:.06em;
}
.aa-chip-led{width:.38em;height:.38em;border-radius:50%;background:#22c55e;box-shadow:0 0 .4em #22c55e}

/* Radio pane */
.radio-zone{flex:1;display:flex;flex-direction:column;padding:.7em 1.1em .5em;gap:.5em}
.radio-header{display:flex;align-items:flex-start;justify-content:space-between}
.radio-freq{font-size:1.9em;font-weight:100;color:#c8dcff;letter-spacing:.02em;line-height:1}
.radio-band{font-size:.48em;font-weight:200;color:rgba(74,159,255,.50);margin-top:.3em;letter-spacing:.14em;text-transform:uppercase}
.radio-station{text-align:right;font-size:.62em;font-weight:200;color:rgba(200,220,255,.40);letter-spacing:.04em}
.radio-live{font-size:.5em;font-weight:200;color:rgba(74,159,255,.30);letter-spacing:.08em;margin-top:.2em;text-transform:uppercase}

/* PUNTO 5 — Presets Radio */
.radio-presets{
  display:flex;gap:.35em;flex-shrink:0;
}
.preset-btn{
  flex:1;background:rgba(74,159,255,.06);
  border:1px solid rgba(74,159,255,.10);
  border-radius:.4em;padding:.3em .3em;
  font-family:inherit;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.1em;
  transition:background .10s,border-color .10s;
}
.preset-btn:hover,.preset-btn.active-preset{
  background:rgba(74,159,255,.16);border-color:rgba(74,159,255,.35);
}
.preset-btn.active-preset .p-freq{color:#5ba3ff}
.p-name{font-size:.42em;font-weight:300;color:rgba(140,175,255,.35);letter-spacing:.04em;white-space:nowrap}
.p-freq{font-size:.50em;font-weight:200;color:rgba(180,210,255,.45);font-variant-numeric:tabular-nums}

.audio-viz{flex:1;display:flex;align-items:flex-end;gap:2px;padding:.15em 0}
.avb{flex:1;border-radius:2px 2px 0 0;background:linear-gradient(180deg,rgba(74,159,255,.65) 0%,rgba(30,90,220,.20) 100%);animation:avb var(--d,.5s) ease-in-out infinite alternate;min-height:2px}
@keyframes avb{from{height:2px}to{height:var(--h,18px)}}
.radio-controls{
  display:flex;align-items:center;justify-content:space-between;
  padding-top:.35em;border-top:1px solid rgba(74,159,255,.07);
}
.rc{background:none;border:none;cursor:pointer;padding:.35em .6em;border-radius:.5em;color:rgba(140,175,255,.35);font-family:inherit;transition:color .10s,background .10s}
.rc:hover{color:rgba(140,175,255,.70);background:rgba(74,159,255,.07)}
.rc svg{width:1.2em;height:1.2em;fill:currentColor;display:block}
.rc.play-btn{background:rgba(74,159,255,.12);border:1px solid rgba(74,159,255,.20);border-radius:.55em;color:#5ba3ff}
.rc.play-btn:hover{background:rgba(74,159,255,.22)}
.rc.play-btn svg{width:1.4em;height:1.4em}

/* ── PANEL DERECHO ── */
.p-right{
  display:flex;flex-direction:column;
  background:rgba(6,9,14,.80);
  overflow:hidden;
}
.nav-zone{
  flex:0 0 50%;
  background:rgba(6,9,16,.80);
  border-bottom:1px solid rgba(74,159,255,.07);
  display:flex;flex-direction:column;
  padding:.65em 1em .55em;gap:.45em;
}
.zone-label{
  font-size:.46em;font-weight:300;
  color:rgba(74,159,255,.35);
  letter-spacing:.18em;text-transform:uppercase;
  padding-bottom:.3em;
  border-bottom:1px solid rgba(74,159,255,.06);
}

/* PUNTO 4 — Nav con estado visual */
.nav-empty{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:.5em;cursor:pointer;
  background:none;border:none;font-family:inherit;color:inherit;
  transition:opacity .10s;
}
.nav-empty:active{opacity:.7}
.nav-empty-icon{
  width:2em;height:2em;border-radius:50%;
  border:1px dashed rgba(74,159,255,.20);
  display:flex;align-items:center;justify-content:center;
}
.nav-empty-icon svg{width:1.1em;height:1.1em;fill:rgba(74,159,255,.30)}
.nav-empty-text{font-size:.55em;font-weight:200;color:rgba(100,145,220,.30);letter-spacing:.06em}
.nav-empty-sub{font-size:.48em;font-weight:200;color:rgba(74,159,255,.18);letter-spacing:.04em}

/* Nav con ruta activa (oculto por defecto) */
.nav-active{display:none;flex-direction:column;gap:.4em;flex:1}
.nav-icon-wrap{width:2em;height:2em;border-radius:.6em;background:rgba(74,159,255,.10);border:1px solid rgba(74,159,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-icon-wrap svg{width:1.1em;height:1.1em;fill:#5ba3ff}
.nav-title{font-size:.78em;font-weight:200;color:rgba(200,220,255,.70)}
.nav-sub{font-size:.50em;font-weight:200;color:rgba(74,159,255,.40);letter-spacing:.04em}
.nav-row{display:flex;align-items:center;gap:.55em}
.nav-pills{display:flex;gap:.3em}
.nav-pill{flex:1;background:rgba(74,159,255,.06);border:1px solid rgba(74,159,255,.10);border-radius:.4em;padding:.28em .4em;font-size:.44em;font-weight:200;color:rgba(140,175,255,.28);letter-spacing:.04em;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav-pill strong{font-size:1.2em;font-weight:200;color:rgba(200,220,255,.50);display:block}

.apps-right{
  flex:1;display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:.5px;background:rgba(74,159,255,.04);
}

/* ── BARRA INFERIOR ── */
.bottom{
  background:rgba(4,6,11,.90);
  border-top:1px solid rgba(74,159,255,.09);
  display:flex;align-items:center;
  padding:0 .6em;gap:.1em;
  position:relative;z-index:1;
}
.bb-home{
  display:flex;align-items:center;justify-content:center;
  width:2.8em;height:100%;
  background:none;border:none;cursor:pointer;
  color:rgba(140,175,255,.30);font-family:inherit;
  transition:color .10s;
  border-right:1px solid rgba(74,159,255,.08);
  margin-right:.3em;flex-shrink:0;
}
.bb-home:hover{color:#5ba3ff}
.bb-home svg{width:1.1em;height:1.1em;fill:currentColor}
.vsep{width:1px;height:1.6em;background:rgba(74,159,255,.08);margin:0 .2em;flex-shrink:0}
.bba{
  display:flex;flex-direction:column;align-items:center;
  gap:.12em;padding:.25em .6em;border-radius:.5em;
  background:none;border:none;cursor:pointer;
  font-family:inherit;color:inherit;
  transition:background .10s;flex-shrink:0;
}
.bba:hover{background:rgba(74,159,255,.07)}
.bba svg{width:1.0em;height:1.0em;fill:rgba(140,175,255,.30)}
.bba span{font-size:.40em;font-weight:300;color:rgba(100,145,220,.25);letter-spacing:.04em;white-space:nowrap}
.bba.on svg{fill:#4a9fff}
.bba.on span{color:rgba(74,159,255,.55)}
.bba.on{background:rgba(74,159,255,.06)}
.bb-flex{flex:1}
.bb-vol{
  display:flex;align-items:center;gap:.45em;
  padding:0 .65em;height:100%;
  border-left:1px solid rgba(74,159,255,.08);flex-shrink:0;
}
.vol-icon svg{width:.9em;height:.9em;fill:rgba(140,175,255,.28)}
.vol-btn{
  display:flex;align-items:center;justify-content:center;
  width:1.6em;height:1.6em;
  background:rgba(74,159,255,.08);border:1px solid rgba(74,159,255,.15);
  border-radius:.45em;cursor:pointer;font-family:inherit;
  color:rgba(140,175,255,.55);font-size:.9em;font-weight:300;
  transition:background .10s,color .10s;flex-shrink:0;user-select:none;
}
.vol-btn:hover{background:rgba(74,159,255,.18);color:#8ab8ff}
.vol-btn:active{background:rgba(74,159,255,.30)}
.vol-display{min-width:2.8em;text-align:center;font-size:.68em;font-weight:200;color:rgba(180,210,255,.55);letter-spacing:.04em;font-variant-numeric:tabular-nums}

/* ── PUNTO 7 — MODO NOCHE (rojo/ámbar) ── */
.root.night-mode{
  --night-c: rgba(255,80,40,.10);
}
.root.night-mode .root-bg::before{
  background:
    radial-gradient(ellipse 55% 45% at 20% 30%, rgba(180,50,20,.08) 0%, transparent 65%),
    radial-gradient(ellipse 40% 50% at 80% 70%, rgba(140,40,10,.06) 0%, transparent 60%);
}
.root.night-mode .sb{background:rgba(12,4,3,.90);border-bottom-color:rgba(200,60,20,.08)}
.root.night-mode .main::before,
.root.night-mode .main::after{
  background:linear-gradient(180deg,transparent 0%,rgba(200,70,20,.15) 30%,rgba(200,70,20,.20) 50%,rgba(200,70,20,.15) 70%,transparent 100%);
}
.root.night-mode .p-left,
.root.night-mode .p-center,
.root.night-mode .p-right{background:rgba(10,3,2,.82)}
.root.night-mode .c-tabs{background:rgba(12,4,3,.88);border-bottom-color:rgba(200,60,20,.08)}
.root.night-mode .c-tab.active{color:#ff7040;border-bottom-color:#d04020}
.root.night-mode .bottom{background:rgba(10,3,2,.92);border-top-color:rgba(200,60,20,.09)}
.root.night-mode .bba.on{background:rgba(200,60,20,.08)}
.root.night-mode .bba.on svg{fill:#e06030}
.root.night-mode .bba.on span{color:rgba(220,90,40,.55)}
.root.night-mode .clk-time{color:#ffe0d0}
.root.night-mode .bmw-orb::after{
  background:radial-gradient(circle at 38% 35%,rgba(255,180,100,.25) 0%,rgba(220,80,30,.60) 40%,rgba(160,40,10,.75) 80%,rgba(100,20,5,.90) 100%);
  box-shadow:0 0 1.5em rgba(220,80,30,.50),inset 0 .15em .5em rgba(255,180,80,.15);
}
.root.night-mode .nav-zone,.root.night-mode .nav-zone{background:rgba(10,4,2,.82)}
.root.night-mode .sb-bmw-dot{background:#d05020;box-shadow:0 0 .4em .1em rgba(210,80,30,.55)}
.root.night-mode #btn-night.on svg{fill:#e06030}

/* ── PUNTO 3 — OVERLAY LLAMADA ENTRANTE ── */
.call-overlay{
  position:absolute;
  top:.8em;left:50%;transform:translateX(-50%) translateY(-4em);
  z-index:100;
  background:rgba(8,12,20,.94);
  border:1px solid rgba(74,159,255,.20);
  border-radius:.9em;
  padding:.6em 1em .6em .8em;
  display:flex;align-items:center;gap:.8em;
  min-width:16em;
  box-shadow:0 .5em 2em rgba(0,0,0,.50), 0 0 0 1px rgba(74,159,255,.08);
  transition:transform .30s cubic-bezier(.34,1.56,.64,1), opacity .25s;
  opacity:0;pointer-events:none;
}
.call-overlay.visible{
  transform:translateX(-50%) translateY(0);
  opacity:1;pointer-events:auto;
}
.call-avatar{
  width:2.6em;height:2.6em;border-radius:50%;
  background:linear-gradient(135deg,rgba(74,159,255,.25),rgba(30,80,200,.40));
  border:1px solid rgba(74,159,255,.25);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.call-avatar svg{width:1.3em;height:1.3em;fill:rgba(140,185,255,.60)}
.call-info{flex:1}
.call-name{font-size:.72em;font-weight:300;color:rgba(220,235,255,.80);letter-spacing:.02em}
.call-status{font-size:.50em;font-weight:200;color:rgba(74,159,255,.45);letter-spacing:.06em;text-transform:uppercase;margin-top:.15em}
.call-btns{display:flex;gap:.5em}
.call-btn{
  width:2em;height:2em;border-radius:50%;
  border:none;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .10s;
}
.call-btn:active{opacity:.75}
.call-btn.answer{background:rgba(34,197,94,.20);border:1px solid rgba(34,197,94,.35)}
.call-btn.answer svg{fill:#22c55e}
.call-btn.reject{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.30)}
.call-btn.reject svg{fill:#ef4444}
.call-btn svg{width:1em;height:1em}
/* Pulso de llamada entrante */
@keyframes callpulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.35)}60%{box-shadow:0 0 0 .4em rgba(34,197,94,.0)}}
.call-overlay.visible .call-btn.answer{animation:callpulse 1.5s ease-out infinite}

      <span>Brillo</span>
    </button>
    <button class="bba">
      <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
      <span>Mirror</span>
    </button>
    <div class="vsep"></div>
    <button class="bba">
      <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
      <span>Apps</span>
    </button>
    <div class="bb-flex"></div>
    <div class="bb-vol">
      <div class="vol-icon"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg></div>
      <button class="vol-btn" id="vol-down">−</button>
      <div class="vol-display" id="vol-num">18 / 30</div>
      <button class="vol-btn" id="vol-up">＋</button>
    </div>
  </div>

</div>

<script>
// ── Reloj ──
const D=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const M=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function p(n){return String(n).padStart(2,'0')}
function tick(){
  const t=new Date(),h=t.getHours(),m=t.getMinutes();
  const ts=p(h)+':'+p(m);
  document.getElementById('clk').textContent=ts;
  document.getElementById('sbt').textContent=ts;
  const dn=D[t.getDay()],mn=M[t.getMonth()];
  document.getElementById('sbd').textContent=
    dn.charAt(0).toUpperCase()+dn.slice(1,3)+', '+t.getDate()+' '+
    mn.charAt(0).toUpperCase()+mn.slice(1,3);
  document.getElementById('cld').textContent=
    dn+', '+t.getDate()+' de '+mn+' de '+t.getFullYear();
}
tick();setInterval(tick,1000);

// ── PUNTO 2 — Velocidad GPS ──
const speedEl=document.getElementById('gps-speed');
const limitEl=document.getElementById('speed-limit');
let gpsAvailable=false;
// Intenta usar GPS real
if(navigator.geolocation){
  navigator.geolocation.watchPosition(pos=>{
    const spd=pos.coords.speed;
    if(spd!==null && spd>=0){
      gpsAvailable=true;
      speedEl.textContent=Math.round(spd*3.6); // m/s → km/h
    }
  },{enableHighAccuracy:true,timeout:5000});
}
// Si no hay GPS (demo en browser), simula velocidad suave
if(!gpsAvailable){
  let demoSpd=0,demoDir=1;
  setInterval(()=>{
    demoSpd+=demoDir*(Math.random()*4-1);
    if(demoSpd>85)demoDir=-1;
    if(demoSpd<0){demoSpd=0;demoDir=1;}
    if(!gpsAvailable) speedEl.textContent=Math.round(demoSpd);
    // Aviso visual si supera límite
    const lim=parseInt(limitEl.textContent)||60;
    limitEl.style.borderColor=demoSpd>lim?'rgba(255,80,60,.80)':'rgba(255,200,80,.55)';
    limitEl.style.color=demoSpd>lim?'rgba(255,100,80,.90)':'rgba(255,220,100,.70)';
    limitEl.style.background=demoSpd>lim?'rgba(255,60,30,.15)':'rgba(255,200,80,.08)';
  },800);
}

// ── Visualizador audio ──
const viz=document.getElementById('aviz');
const hts=[6,12,20,26,18,30,24,16,28,22,14,26,18,34,26,16,22,12,18,24,28,20,14,26,10,22,30,18];
hts.forEach(h=>{
  const b=document.createElement('div');b.className='avb';
  b.style.setProperty('--h',h+'px');
  b.style.setProperty('--d',(.28+Math.random()*.55).toFixed(2)+'s');
  viz.appendChild(b);
});

// ── Toggles BT / WiFi ──
['btn-bt','btn-wifi'].forEach(id=>{
  const el=document.getElementById(id);
  if(el) el.addEventListener('click',()=>el.classList.toggle('on'));
});

// ── PUNTO 7 — Modo noche funcional ──
function toggleNight(){
  const root=document.getElementById('root');
  const btn=document.getElementById('btn-night');
  root.classList.toggle('night-mode');
  btn.classList.toggle('on');
}

// ── Android Auto tap ──
document.getElementById('aa-btn').addEventListener('click',function(){
  this.style.opacity='.5';setTimeout(()=>this.style.opacity='1',1200);
});

// ── Tab switcher ──
function switchTab(name){
  ['aa','radio'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===name);
    document.getElementById('pane-'+t).classList.toggle('active',t===name);
  });
}

// ── PUNTO 5 — Presets radio ──
function setPreset(btn,freq,station){
  document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active-preset'));
  btn.classList.add('active-preset');
  document.getElementById('radio-freq-disp').textContent=freq;
  document.getElementById('radio-station-disp').textContent=station;
}

// ── PUNTO 4 — Navegación demo ──
function simulateNav(){
  document.getElementById('nav-empty-btn').style.display='none';
  document.getElementById('nav-active-zone').style.display='flex';
}

// ── PUNTO 3 — Overlay llamada entrante ──
// Demo: tocar el botón de Teléfono simula llamada entrante
let callTimer=null;
document.getElementById('btn-demo-call').addEventListener('click',()=>{
  showCall('María González');
});
function showCall(name){
  document.getElementById('caller-name').textContent=name;
  document.getElementById('call-overlay').classList.add('visible');
  if(callTimer) clearTimeout(callTimer);
  callTimer=setTimeout(dismissCall,12000); // auto-dismiss en 12s
}
function dismissCall(){
  document.getElementById('call-overlay').classList.remove('visible');
  if(callTimer){clearTimeout(callTimer);callTimer=null;}
}

// ── Volumen ──
let vol=18,volMax=30;
const volNum=document.getElementById('vol-num');
function renderVol(){volNum.textContent=vol+' / '+volMax;}
document.getElementById('vol-up').addEventListener('click',()=>{if(vol<volMax){vol++;renderVol();}});
document.getElementById('vol-down').addEventListener('click',()=>{if(vol>0){vol--;renderVol();}});
renderVol();
</script>
