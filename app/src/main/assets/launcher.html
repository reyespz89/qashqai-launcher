<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qashqai Launcher</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #fff; font-family: -apple-system,'Helvetica Neue',Arial,sans-serif; width:100vw; height:100vh; overflow:hidden; display:flex; flex-direction:column; user-select:none; }
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:10px 24px 6px; background:rgba(255,255,255,0.04); border-bottom:1px solid rgba(255,255,255,0.07); }
  .topbar-date { font-size:13px; color:rgba(255,255,255,0.5); }
  .topbar-brand { font-size:13px; color:rgba(255,255,255,0.25); letter-spacing:0.1em; text-transform:uppercase; }
  .main { flex:1; display:flex; align-items:center; padding:0 32px; gap:36px; }
  .clock-section { display:flex; flex-direction:column; align-items:flex-start; min-width:190px; }
  .clock { font-size:82px; font-weight:200; letter-spacing:-3px; line-height:1; }
  .clock-date { font-size:14px; color:rgba(255,255,255,0.38); margin-top:10px; text-transform:capitalize; }
  .divider { width:1px; height:90px; background:rgba(255,255,255,0.1); flex-shrink:0; }
  .apps-grid { flex:1; display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .app-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; padding:16px 10px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:14px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .app-btn:active { background:rgba(255,255,255,0.13); transform:scale(0.95); }
  .app-btn.primary { background:rgba(66,133,244,0.16); border-color:rgba(66,133,244,0.32); }
  .app-btn.primary:active { background:rgba(66,133,244,0.30); }
  .app-icon { font-size:28px; line-height:1; }
  .app-label { font-size:10px; color:rgba(255,255,255,0.6); text-align:center; font-weight:500; }
  .app-btn.primary .app-label { color:rgba(255,255,255,0.88); }
  .statusbar { display:flex; justify-content:center; align-items:center; gap:28px; padding:7px 24px; background:rgba(255,255,255,0.03); border-top:1px solid rgba(255,255,255,0.06); }
  .status-item { display:flex; align-items:center; gap:5px; font-size:11px; color:rgba(255,255,255,0.28); }
  .status-dot { width:6px; height:6px; border-radius:50%; background:rgba(255,255,255,0.15); }
  .status-dot.on { background:#4ade80; box-shadow:0 0 5px #4ade80; }
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-date" id="topdate"></span>
  <span class="topbar-brand">Nissan Qashqai</span>
</div>
<div class="main">
  <div class="clock-section">
    <div class="clock" id="clock"></div>
    <div class="clock-date" id="clockdate"></div>
  </div>
  <div class="divider"></div>
  <div class="apps-grid">
    <div class="app-btn primary" onclick="launchZLink()"><span class="app-icon">📱</span><span class="app-label">Android Auto</span></div>
    <div class="app-btn" onclick="launchApp('com.android.car.radio')"><span class="app-icon">📻</span><span class="app-label">Radio FM</span></div>
    <div class="app-btn" onclick="launchApp('com.android.music')"><span class="app-icon">🎵</span><span class="app-label">Música</span></div>
    <div class="app-btn" onclick="launchApp('com.android.settings')"><span class="app-icon">⚙️</span><span class="app-label">Ajustes</span></div>
    <div class="app-btn" onclick="launchApp('com.android.camera2')"><span class="app-icon">📷</span><span class="app-label">Cámara</span></div>
    <div class="app-btn" onclick="launchApp('com.android.car.media')"><span class="app-icon">🎬</span><span class="app-label">Medios</span></div>
    <div class="app-btn" onclick="launchApp('com.android.maps')"><span class="app-icon">🗺️</span><span class="app-label">Navegación</span></div>
    <div class="app-btn" onclick="launchApp('com.android.bluetooth')"><span class="app-icon">🔵</span><span class="app-label">Bluetooth</span></div>
  </div>
</div>
<div class="statusbar">
  <div class="status-item"><div class="status-dot on"></div><span>ZLink</span></div>
  <div class="status-item"><div class="status-dot"></div><span>Bluetooth</span></div>
  <div class="status-item"><div class="status-dot"></div><span>WiFi</span></div>
</div>
<script>
  function updateClock(){var n=new Date(),h=n.getHours(),m=n.getMinutes();document.getElementById('clock').textContent=(h<10?'0':'')+h+':'+(m<10?'0':'')+m;var days=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'],months=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];document.getElementById('clockdate').textContent=days[n.getDay()]+' '+n.getDate()+' de '+months[n.getMonth()];document.getElementById('topdate').textContent=days[n.getDay()]+', '+n.getDate()+' '+months[n.getMonth()].substring(0,3)+' '+n.getFullYear();}
  updateClock();setInterval(updateClock,1000);
  function launchZLink(){var p=['com.zjinnova.zlink','com.xyauto.zlink','com.carsync.zlink','com.zlink.carplay','com.google.android.projection.gearhead'];if(window.Android){for(var i=0;i<p.length;i++){try{Android.launchApp(p[i]);return;}catch(e){}}}}
  function launchApp(pkg){if(window.Android){try{Android.launchApp(pkg);}catch(e){}}}
</script>
</body>
</html>
